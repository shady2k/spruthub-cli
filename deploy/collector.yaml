# Example only: replace registry/OpenBao endpoints and KV path after approval.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spruthub-log-collector
  namespace: logging
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spruthub-log-collector
  namespace: logging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spruthub-log-collector
  template:
    metadata:
      labels:
        app: spruthub-log-collector
      annotations:
        vault.security.banzaicloud.io/vault-addr: https://openbao.example.invalid
        vault.security.banzaicloud.io/vault-skip-verify: "false"
        vault.security.banzaicloud.io/vault-role: k8s
        vault.security.banzaicloud.io/vault-path: kubernetes
        vault.security.banzaicloud.io/vault-auth-method: kubernetes
        vault.security.banzaicloud.io/vault-ignore-missing-secrets: "false"
        vault.security.banzaicloud.io/run-as-non-root: "true"
        vault.security.banzaicloud.io/run-as-user: "1000"
        vault.security.banzaicloud.io/run-as-group: "1000"
        vault.security.banzaicloud.io/readonly-root-fs: "true"
        vault.security.banzaicloud.io/psp-allow-privilege-escalation: "false"
    spec:
      serviceAccountName: spruthub-log-collector
      # Only init needs the JWT for OpenBao Kubernetes auth. Hide it from collector.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-credentials
          image: registry.example.invalid/homelab/spruthub-log-collector:review-required
          command: [node, /app/prepare-credentials.mjs]
          env:
            - name: WS_URL
              value: vault:kv/data/apps/spruthub-log-collector#WS_URL
            - name: EMAIL
              value: vault:kv/data/apps/spruthub-log-collector#EMAIL
            - name: PASSWORD
              value: vault:kv/data/apps/spruthub-log-collector#PASSWORD
            - name: SERIAL
              value: vault:kv/data/apps/spruthub-log-collector#SERIAL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: credentials
              mountPath: /var/run/spruthub
      containers:
        - name: collector
          image: registry.example.invalid/homelab/spruthub-log-collector:review-required
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: credentials
              mountPath: /var/run/spruthub
              readOnly: true
            - name: no-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: no-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
